[package]
name = "flintplayer-desktop"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Low-latency V4L2 capture and PotPlayer-style media player for Linux, built with Rust and GPUI"

[[bin]]
name = "flintplayer"
path = "src/main.rs"

[dependencies]
flint-core.workspace = true
flint-media.workspace = true
flint-engine.workspace = true
gpui = { version = "=0.2.2", git = "https://github.com/nyakang/zed", rev = "a755e55acb90229c687e64e6a84877fb70d21619" }
gpui-kit = { git = "https://github.com/nyakang/gpui-kit", rev = "9143df9774d0190162053defc9b1faac3f8ab907" }
log.workspace = true
image.workspace = true
x11rb = "0.13"
env_logger.workspace = true
libc.workspace = true

[features]
static-ffmpeg = ["flint-media/static-ffmpeg"]

[package.metadata.deb]
name = "flintplayer"
maintainer = "lzzhang <flint.lzzhang@ingenic.com>"
copyright = "2026, lzzhang"
license-file = ["../../LICENSE", "4"]
extended-description = "A sleek, low-latency USB V4L2 capture and PotPlayer-style media player for Linux. GPUI video canvas, libmpv playback engine, 1:1 PotPlayer menu/UX parity, and frame-accurate single-frame analysis."
section = "video"
priority = "optional"
depends = "$auto, fonts-noto-cjk, libmpv2 | libmpv1, libvulkan1, mesa-vulkan-drivers"
recommends = "zenity, ffmpeg, xdg-utils"
assets = [
    ["target/release/flintplayer", "opt/flintplayer/bin/flintplayer", "755"],
    ["../../assets/flintplayer.desktop", "usr/share/applications/flintplayer.desktop", "644"],
    ["../../assets/icons/flintplayer.png", "usr/share/icons/hicolor/256x256/apps/flintplayer.png", "644"],
    { dest = "usr/bin/flintplayer", link_name = "/opt/flintplayer/bin/flintplayer" },
]
