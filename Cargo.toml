[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-media",
    "crates/flint-gpui",
    "crates/flint-engine",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["lzzhang <flint.lzzhang@ingenic.com>"]

[workspace.dependencies]
flint-core = { path = "crates/flint-core" }
flint-media = { path = "crates/flint-media" }
flint-engine = { path = "crates/flint-engine" }
ffmpeg-next = { version = "6.1", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
libc = "0.2"
encoding_rs = "0.8"
log = "0.4"
libloading = "0.8"
env_logger = "0.11"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[patch."https://github.com/nyakang/zed"]
gpui = { version = "=0.2.2", git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_apple = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_ios = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_linux = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_macos = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_macros = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_platform = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_util = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_web = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_wgpu = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
gpui_windows = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
collections = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
http_client = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
scheduler = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
sum_tree = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
ztracing = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }
ztracing_macro = { git = "https://github.com/zhaozhao27/zed", rev = "9077e66fc3f27ef916e7a922535c16bc07f7dd96" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
