[workspace]
resolver = "2"
members = [
    "crates/flint-core",
    "crates/flint-media",
    "crates/flint-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["lzzhang <flint.lzzhang@ingenic.com>"]

[workspace.dependencies]
flint-core = { path = "crates/flint-core" }
flint-media = { path = "crates/flint-media" }
ffmpeg-next = { version = "6.1", default-features = false, features = ["codec", "format", "software-scaling"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
slint = { version = "1.18", features = ["unstable-winit-030"] }
slint-build = "1.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
